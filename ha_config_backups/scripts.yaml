roomba_forward:
  alias: "Roomba: Avanzar"
  icon: mdi:arrow-up-bold
  sequence:
    - service: mqtt.publish
      data:
        topic: "roomba/commands"
        payload: "forward"

roomba_backward:
  alias: "Roomba: Retroceder"
  icon: mdi:arrow-down-bold
  sequence:
