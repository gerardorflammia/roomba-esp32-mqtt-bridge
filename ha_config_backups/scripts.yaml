roomba_forward:
  alias: "Roomba: Forward"
  icon: mdi:arrow-up-bold
  sequence:
    - service: mqtt.publish
      data:
        topic: "roomba/commands"
        payload: "forward"

roomba_backward:
  alias: "Roomba: Backward"
  icon: mdi:arrow-down-bold
  sequence:
    - service: mqtt.publish
      data:
        topic: "roomba/commands"
        payload: "backward"

