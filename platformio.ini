[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Monitor Serial Speed
monitor_speed = 115200

; Libraries
lib_deps =
    knolleary/PubSubClient @ ^2.8
    ; ArduinoOTA is built-in for ESP32 arduino core

; Upload Protocol (Start with Serial, then switch to espota)
upload_protocol = esptool
; upload_protocol = espota
; upload_port = 192.168.x.x ; Set your ESP32 IP after first flash
